# CI of the read-only split repository indexnowkit/php-doctrine. Development happens in the monorepo
# https://github.com/indexnowkit/php, whose CI runs the same ci:install:* scripts of composer.json against the
# working copy of the sibling packages. Between releases the indexnowkit/* constraints resolve to the
# siblings' main branches, hence minimum-stability dev (with prefer-stable) in composer.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [highest]
        include:
          - { php: '8.2', deps: lowest }
          - { php: '8.3', deps: dbal3 }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Install (${{ matrix.deps }})
        run: composer run ci:install:${{ matrix.deps }}
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G
        # DBAL 3 / ORM 2 declare their signatures in docblocks that contradict DBAL 4 / ORM 3; phpstan runs on the DBAL 4 install only.
        if: matrix.deps == 'highest'
