# CI of the read-only split repository indexnowkit/php-doctrine. Development happens in
# https://github.com/indexnowkit/php (monorepo), whose CI covers all packages together.
# Between releases indexnowkit/core ^0.2 resolves to its main branch (0.2.x-dev), hence minimum-stability dev.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [highest]
        include:
          - php: '8.3'
            deps: dbal3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: composer config minimum-stability dev && composer config prefer-stable true
      - name: Install (highest)
        if: matrix.deps == 'highest'
        run: composer update --no-interaction --prefer-dist
      - name: Install (DBAL 3 / ORM 2)
        if: matrix.deps == 'dbal3'
        run: composer update --no-interaction --prefer-dist --with doctrine/dbal:^3.8 --with doctrine/orm:^2.19
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G
        if: matrix.deps == 'highest'
